<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimeX - Stream Unlimited Entertainment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--p:#00A8E1;--s:#FF6B35;--a:#FFD23F;--bg:#050505;--card:rgba(20,20,20,.92);--t:#fff;--t2:#B3B3B3;--t3:#737373;--danger:#E50914;--glass:rgba(255,255,255,.06);--gb:rgba(255,255,255,.12);--glow:0 0 20px rgba(0,168,225,.4);--r:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t);overflow-x:hidden;line-height:1.6}
body.light{--bg:#fff;--card:rgba(255,255,255,.95);--t:#1a1a1a;--t2:#4a4a4a;--t3:#8a8a8a;--glass:rgba(0,0,0,.04);--gb:rgba(0,0,0,.1)}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}button{border:0;background:none;cursor:pointer;font-family:inherit;color:inherit}
.hidden{display:none!important}
#loader{position:fixed;inset:0;background:linear-gradient(135deg,#050505,#1a0a2e);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;transition:.5s}
#loader.off{opacity:0;visibility:hidden}
.logo{font-size:1.8rem;font-weight:900;background:linear-gradient(45deg,var(--p),var(--a));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer}
#loader .logo{font-size:4rem;margin-bottom:1.5rem;animation:pu 2s infinite}
.spin{width:50px;height:50px;border:4px solid rgba(255,255,255,.1);border-top-color:var(--p);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes pu{50%{opacity:.7;transform:scale(1.05)}}
.nav{position:fixed;top:0;left:0;right:0;height:70px;background:linear-gradient(180deg,rgba(0,0,0,.9),transparent);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:0 4%;z-index:1000;transition:.3s}
.nav.sc{background:rgba(15,15,15,.96)}
.nav::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,#FF9933 33%,#fff 33% 66%,#138808 66%);opacity:.7}
.nl,.nr{display:flex;align-items:center;gap:1.5rem}.nl{gap:2.5rem}
.links{display:flex;gap:1.8rem}
.links a{font-size:.95rem;font-weight:500;color:var(--t2);position:relative;transition:.3s}
.links a.on,.links a:hover{color:#fff}
.links a::after{content:"";position:absolute;bottom:-5px;left:0;width:0;height:2px;background:var(--p);transition:.3s}
.links a.on::after,.links a:hover::after{width:100%}
.sbox{width:0;overflow:hidden;transition:.4s;position:relative}.sbox.on{width:260px}
.sbox input{width:100%;padding:.6rem 1rem;background:var(--glass);border:1px solid var(--gb);border-radius:var(--r);color:var(--t);outline:0}
.sbox input:focus{border-color:var(--p)}
.ic{font-size:1.15rem;color:var(--t2);cursor:pointer;transition:.3s}.ic:hover{color:#fff;transform:scale(1.1)}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--s));display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
select{background:var(--glass);border:1px solid var(--gb);color:var(--t);border-radius:8px;padding:.35rem .5rem;font-size:.85rem}select option{color:#000}
.hero{position:relative;height:85vh;margin-top:70px;overflow:hidden;background:#111}
.hbg{position:absolute;inset:0;background-size:cover;background-position:center top;filter:brightness(.55);transition:opacity .8s}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg),transparent 55%),linear-gradient(to right,rgba(0,0,0,.7),transparent 60%)}
.hc{position:absolute;bottom:15%;left:4%;max-width:620px;z-index:2}
.badge{display:inline-flex;gap:.5rem;align-items:center;padding:.4rem 1rem;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--gb);border-radius:50px;font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-bottom:1rem}
.ht{font-size:clamp(2rem,5vw,4rem);font-weight:900;line-height:1.1;margin-bottom:1rem;text-shadow:2px 2px 20px #000;color:#fff}
.hm{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap;margin-bottom:1.2rem;font-size:.95rem;color:#fff}
.rt i{color:var(--a)}
.hd{color:var(--t2);margin-bottom:1.8rem;max-width:550px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.btns{display:flex;gap:1rem;flex-wrap:wrap}
.btn{padding:.85rem 1.8rem;border-radius:8px;font-weight:600;display:inline-flex;gap:.7rem;align-items:center;transition:.3s}
.b1{background:var(--p);color:#fff;box-shadow:0 4px 15px rgba(0,168,225,.3)}.b1:hover{background:#0090C1;transform:translateY(-2px)}
.b2{background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border:1px solid var(--gb);color:#fff}.b2:hover{background:rgba(255,255,255,.2);transform:translateY(-2px)}
.chips{display:flex;gap:.8rem;padding:1rem 4%;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{padding:.5rem 1.4rem;background:var(--glass);border:1px solid var(--gb);border-radius:50px;white-space:nowrap;cursor:pointer;transition:.3s;font-weight:500}
.chip:hover,.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.sec{padding:1.5rem 4%}.sec h2{font-size:1.5rem;font-weight:700;margin-bottom:1rem}
.row{display:flex;gap:1rem;overflow-x:auto;padding:1rem 0 1.5rem;scroll-behavior:smooth;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.wrap{position:relative}
.nv{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.75);color:#fff;z-index:10;opacity:0;transition:.3s}
.sec:hover .nv{opacity:1}.nv:hover{background:var(--p)}.nv.l{left:-1.5%}.nv.r{right:-1.5%}
.card{min-width:200px;width:200px;position:relative;cursor:pointer;border-radius:var(--r);overflow:hidden;transition:.4s cubic-bezier(.175,.885,.32,1.275);background:#161616;flex-shrink:0}
.card:hover{transform:scale(1.08) translateY(-8px);z-index:20;box-shadow:var(--glow)}
.card img,.ph{width:100%;height:290px;object-fit:cover;transition:.3s}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;padding:1rem;font-weight:700;background:linear-gradient(135deg,#1a1a2e,#16213e)}
.card:hover img{filter:brightness(.5)}
.ov{position:absolute;bottom:0;left:0;right:0;padding:1.2rem .9rem;background:linear-gradient(to top,rgba(0,0,0,.96),transparent);opacity:0;transform:translateY(15px);transition:.3s;color:#fff}
.card:hover .ov{opacity:1;transform:none}
.ov h3{font-size:.95rem;margin-bottom:.3rem}.ov .m{font-size:.75rem;color:#ccc;display:flex;gap:.6rem;flex-wrap:wrap}
.tag{padding:.1rem .5rem;border:1px solid var(--gb);border-radius:4px;font-size:.68rem;text-transform:uppercase;font-weight:600;background:var(--glass)}
.add{position:absolute;top:.6rem;right:.6rem;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.75);color:#fff;opacity:0;transition:.3s}
.card:hover .add{opacity:1}.add.on{background:var(--danger)}.add:hover{background:var(--p)}
.t10 .card{min-width:170px;width:170px;margin-left:34px}
.t10 .card img,.t10 .ph{height:250px}
.num{position:absolute;left:-38px;bottom:0;font-size:7rem;font-weight:900;color:transparent;-webkit-text-stroke:2px var(--t2);line-height:.8;pointer-events:none;z-index:-1}
.t10 .card{overflow:visible}.t10 .card img,.t10 .card .ph{border-radius:var(--r)}
.t10 .wrapn{position:relative;flex-shrink:0}
.sk{background:linear-gradient(90deg,var(--glass) 25%,rgba(255,255,255,.1) 50%,var(--glass) 75%);background-size:200% 100%;animation:ld 1.5s infinite;border-radius:var(--r);min-width:200px;height:290px}
@keyframes ld{to{background-position:-200% 0}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1.4rem}.grid .card{width:auto;min-width:0}
.empty{text-align:center;padding:4rem 0;color:var(--t2)}.empty i{font-size:4rem;color:var(--t3);margin-bottom:1rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:flex-start;justify-content:center;z-index:9999;opacity:0;visibility:hidden;transition:.3s;overflow-y:auto;padding:4vh 0}
.modal.on{opacity:1;visibility:visible}
.mc{width:92%;max-width:960px;background:var(--card);border-radius:16px;overflow:hidden;position:relative;box-shadow:0 8px 40px #000;color:var(--t)}
.x{position:absolute;top:1rem;right:1rem;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;z-index:5}.x:hover{background:var(--danger)}
.mv{position:relative;aspect-ratio:16/9;background:#000 center/cover}
.mv::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--card),transparent 60%);pointer-events:none}
.mv iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:2}
.mb{padding:1.5rem 2rem 2rem;margin-top:-4rem;position:relative;z-index:3}
.mb h2{font-size:2rem;font-weight:800;margin-bottom:.5rem}
.mm{display:flex;gap:1rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem;color:var(--t2);font-size:.92rem}
.mb p{color:var(--t2);margin-bottom:1.2rem}
.wt{font-weight:700;margin:1.2rem 0 .6rem;display:flex;gap:1rem;align-items:center}
.src{display:flex;flex-wrap:wrap;gap:.6rem}
.src a{padding:.55rem 1rem;background:var(--glass);border:1px solid var(--gb);border-radius:8px;font-size:.85rem;font-weight:600;transition:.3s}
.src a:hover{background:var(--p);border-color:var(--p);color:#fff;transform:translateY(-2px)}
.src small{color:var(--a);margin-left:.4rem}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:.8rem 1.4rem;border-radius:10px;z-index:100000;border-left:4px solid var(--s);box-shadow:0 4px 20px #000;font-size:.9rem}
.warn{background:#3a1d00;color:#ffd9a8;padding:.8rem 4%;margin-top:70px;text-align:center;font-size:.9rem}.warn+.hero{margin-top:0}
footer{text-align:center;padding:3rem 1rem;color:var(--t3);font-size:.85rem}
@media(max-width:768px){.links{display:none}.hero{height:65vh}.card{min-width:140px;width:140px}.card img,.ph{height:205px}.t10 .card{min-width:120px;width:120px}.t10 .card img,.t10 .ph{height:175px}.num{font-size:5rem;left:-28px}.sbox.on{width:150px}.mb{padding:1rem 1.2rem}.nv{display:none}}
</style>
</head>
<body>
<div id="loader"><div class="logo">PrimeX</div><div class="spin"></div><p style="margin-top:1.2rem;color:#b3b3b3;letter-spacing:2px;font-size:.9rem">CHAI PEE LO, BAS AA GAYA...</p></div>

<nav class="nav" id="nav">
 <div class="nl"><div class="logo" onclick="go('home')">PrimeX</div>
  <div class="links"><a href="#" class="on" data-v="home">Home</a><a href="#" data-v="movies">Movies</a><a href="#" data-v="tv">TV Shows</a><a href="#" data-v="list">My List</a></div></div>
 <div class="nr">
  <div class="sbox" id="sbox"><input id="si" placeholder="Search movies, shows..." autocomplete="off"></div>
  <i class="fas fa-search ic" id="st"></i>
  <select id="reg" title="Region"><option>IN</option><option>US</option><option>GB</option><option>CA</option><option>AU</option></select>
  <i class="fas fa-sun ic" id="th"></i>
  <div class="av">U</div>
 </div>
</nav>

<div id="warn" class="warn hidden">⚠️ <b>WORKER_URL</b> set nahi hai — file ke script me apna Cloudflare Worker URL daalo.</div>

<section class="hero" id="hero"><div class="hbg" id="hbg"></div>
 <div class="hc"><div class="badge"><i class="fas fa-star"></i><span>Top Pick for You</span></div>
  <h1 class="ht" id="htitle">Loading...</h1><div class="hm" id="hmeta"></div><p class="hd" id="hdesc"></p>
  <div class="btns"><button class="btn b1" id="hplay"><i class="fas fa-play"></i> Where to Watch</button><button class="btn b2" id="hinfo"><i class="fas fa-info-circle"></i> More Info</button></div></div>
</section>

<div class="chips" id="chips"></div>
<main id="main"></main>
<footer>PrimeX • Data by Watchmode • Banaya gaya ❤️ ke saath, India se 🇮🇳</footer>

<div class="modal" id="modal"><div class="mc"><button class="x" onclick="closeM()"><i class="fas fa-times"></i></button><div id="mbody"></div></div></div>

<script>
/* ============ CONFIG ============ */
const WORKER_URL = "https://watchmode-api.dhimanparas605.workers.dev"; // <-- apna Cloudflare Worker URL yahan daalo
const TTL = 7 * 864e5;   // details/search cache: 7 din (Watchmode free quota bachane ke liye)
const SRC_TTL = 6 * 36e5; // sources cache: 6 ghante

const ROWS = [
 {id:"top",name:"🔥 Top 10 in India",top:true,list:[["Jawan",2023],["Animal",2023],["12th Fail",2023],["RRR",2022],["KGF: Chapter 2",2022],["Pushpa: The Rise",2021],["Kantara",2022],["Dunki",2023],["Salaar",2023],["Jailer",2023]]},
 {id:"tr",name:"Trending Now",list:[["Panchayat"],["Mirzapur"],["Sacred Games"],["Scam 1992"],["The Family Man"],["Kota Factory"],["Delhi Crime"],["Paatal Lok"]]},
 {id:"bw",name:"Bollywood & Desi Blockbusters",list:[["Dangal",2016],["3 Idiots",2009],["Gully Boy",2019],["Drishyam",2015],["Kahaani",2012],["Tumbbad",2018],["Laapataa Ladies",2023],["Stree 2",2024]]},
 {id:"hw",name:"Hollywood Hits",list:[["Interstellar",2014],["Inception",2010],["Oppenheimer",2023],["Dune",2021],["The Dark Knight",2008],["Parasite",2019]]},
 {id:"sr",name:"Binge-Worthy Series",list:[["Breaking Bad"],["Stranger Things"],["Money Heist"],["The Boys"],["Succession"],["Dark"]]}
];
const GENRES = [["all","All"],["Action","Action"],["Drama","Drama"],["Comedy","Comedy"],["Thriller","Thriller"],["Romance","Romance"],["Science Fiction","Sci-Fi"],["Horror","Horror"],["Crime","Crime"],["Animation","Animation"]];

/* ============ STATE & HELPERS ============ */
const $ = s => document.querySelector(s);
let view="home", genre="all", region=localStorage.px_region||"IN", heroList=[], heroIdx=0, heroTimer;
let myList=JSON.parse(localStorage.px_list||"[]"), recent=JSON.parse(localStorage.px_recent||"[]");
const store=new Map(); // id -> details
const rowData={};      // rowId -> [details]
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const save=()=>{localStorage.px_list=JSON.stringify(myList);localStorage.px_recent=JSON.stringify(recent)};
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}

/* request queue (max 4 parallel) + localStorage cache + in-flight dedupe */
const queue=[];let active=0;const inflight={};
function pump(){while(active<4&&queue.length){const t=queue.shift();active++;t.fn().then(t.ok,t.no).finally(()=>{active--;pump()})}}
const limit=fn=>new Promise((ok,no)=>{queue.push({fn,ok,no});pump()});
async function api(path,ttl=TTL){
  const k="px:"+path;
  try{const c=JSON.parse(localStorage.getItem(k));if(c&&Date.now()-c.t<ttl)return c.d}catch{}
  if(inflight[k])return inflight[k];
  inflight[k]=limit(async()=>{
    const r=await fetch(WORKER_URL+path);
    if(!r.ok){const e=new Error(r.status);e.status=r.status;throw e}
    const d=await r.json();
    try{localStorage.setItem(k,JSON.stringify({t:Date.now(),d}))}catch{ // quota full -> purane px: cache saaf
      Object.keys(localStorage).filter(x=>x.startsWith("px:")).forEach(x=>localStorage.removeItem(x))}
    return d;
  }).finally(()=>delete inflight[k]);
  return inflight[k];
}
let warned=false;
function onErr(e){if(warned)return;warned=true;
  toast(e.status===429||e.status===402?"API limit khatam ho gayi — thodi der baad try karo":"Data load nahi hua — Worker URL check karo")}
const details=id=>api("/title/"+id).then(d=>{store.set(d.id,d);return d});
async function resolve([name,year]){
  const s=await api("/search?q="+encodeURIComponent(name));
  const r=s.title_results||[];
  const m=(year&&r.find(x=>x.year==year))||r[0];
  return m?details(m.id):null;
}
const isMovie=t=>t.type==="movie"||t.type==="tv_movie";
const typeLabel=t=>isMovie(t)?"Movie":"Series";
const poster=t=>t.poster||t.image_url||"";
const ytId=u=>{const m=(u||"").match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);return m&&m[1]};
const dur=m=>m?`${Math.floor(m/60)?Math.floor(m/60)+"h ":""}${m%60}m`:"";
const rating=t=>t.user_rating?(+t.user_rating).toFixed(1):(t.critic_score?(t.critic_score/10).toFixed(1):"");

/* ============ CARDS ============ */
function card(t,i){
  const inL=myList.includes(t.id), img=poster(t);
  const c=`<div class="card" data-id="${t.id}">
    ${img?`<img src="${esc(img)}" alt="${esc(t.title)}" loading="lazy" onerror="this.outerHTML='<div class=ph>${esc(t.title).replace(/'/g,"")}</div>'">`:`<div class="ph">${esc(t.title)}</div>`}
    <button class="add ${inL?"on":""}" data-add="${t.id}"><i class="fas fa-${inL?"check":"plus"}"></i></button>
    <div class="ov"><h3>${esc(t.title)}</h3><div class="m">${rating(t)?`<span class="rt"><i class="fas fa-star"></i> ${rating(t)}</span>`:""}<span>${t.year||""}</span><span>${typeLabel(t)}</span></div>
    <div style="margin-top:.4rem;display:flex;gap:.3rem;flex-wrap:wrap">${(t.genre_names||[]).slice(0,2).map(g=>`<span class="tag">${esc(g)}</span>`).join("")}</div></div></div>`;
  return i==null?c:`<div class="wrapn"><div class="num">${i+1}</div>${c}</div>`;
}
const passes=t=>(genre==="all"||(t.genre_names||[]).includes(genre))&&(view==="movies"?isMovie(t):view==="tv"?!isMovie(t):true);

/* ============ RENDER ============ */
function skeleton(n=6){return Array(n).fill('<div class="sk"></div>').join("")}
function buildHome(){
  $("#main").innerHTML=ROWS.map(r=>`<section class="sec ${r.top?"t10":""}" id="sec-${r.id}"><h2>${r.name}</h2>
    <div class="wrap"><button class="nv l" data-sc="${r.id}:-1"><i class="fas fa-chevron-left"></i></button>
    <div class="row" id="row-${r.id}">${skeleton()}</div>
    <button class="nv r" data-sc="${r.id}:1"><i class="fas fa-chevron-right"></i></button></div></section>`).join("")
    +`<section class="sec hidden" id="sec-rec"><h2>Recently Viewed</h2><div class="row" id="row-rec"></div></section>`
    +`<section class="sec hidden" id="sec-out"><h2 id="outT"></h2><div class="grid" id="out"></div><div class="empty hidden" id="emp"><i class="fas fa-film"></i><h3>Kuch nahi mila</h3><p>Dusra keyword try karo</p></div></section>`;
  ROWS.forEach(r=>{rowData[r.id]=[];obs.observe($("#sec-"+r.id))});
  drawRecent();
}
function drawRow(r){
  const el=$("#row-"+r.id),sec=$("#sec-"+r.id);if(!el)return;
  const items=rowData[r.id].filter(passes);
  sec.classList.toggle("hidden",!items.length&&rowData[r.id].length>0&&(genre!=="all"||view!=="home"));
  el.innerHTML=items.length?items.map((t,i)=>card(t,r.top?i:null)).join(""):(rowData[r.id].length?"":skeleton());
}
async function loadRow(r){
  if(r.loaded)return;r.loaded=true;
  const res=await Promise.all(r.list.map(x=>resolve(x).catch(e=>{onErr(e);return null})));
  rowData[r.id]=res.filter(Boolean);
  if(r.id==="top"&&!heroList.length){heroList=rowData.top.filter(t=>t.backdrop).slice(0,5);setHero(0);clearInterval(heroTimer);heroTimer=setInterval(()=>setHero(heroIdx+1),9000)}
  drawRow(r);
}
const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){obs.unobserve(e.target);loadRow(ROWS.find(r=>"sec-"+r.id===e.target.id))}}),{rootMargin:"300px"});

function setHero(i){
  if(!heroList.length)return;heroIdx=i%heroList.length;const t=heroList[heroIdx];
  $("#hbg").style.backgroundImage=`url("${t.backdrop}")`;
  $("#htitle").textContent=t.title;
  $("#hmeta").innerHTML=`${rating(t)?`<span class="rt"><i class="fas fa-star"></i> ${rating(t)}</span>`:""}<span>${t.year||""}</span><span>${dur(t.runtime_minutes)}</span>${t.us_rating?`<span class="tag">${esc(t.us_rating)}</span>`:""}${(t.genre_names||[]).slice(0,3).map(g=>`<span class="tag">${esc(g)}</span>`).join("")}`;
  $("#hdesc").textContent=t.plot_overview||"";
  $("#hplay").onclick=$("#hinfo").onclick=()=>openM(t.id);
}
function drawRecent(){
  const items=recent.map(id=>store.get(id)).filter(Boolean);
  $("#sec-rec").classList.toggle("hidden",!items.length||view!=="home"||genre!=="all");
  $("#row-rec").innerHTML=items.map(t=>card(t)).join("");
}
function showOut(title,items,msg){
  $("#sec-out").classList.remove("hidden");$("#outT").textContent=title;
  $("#out").innerHTML=items.map(t=>card(t)).join("");$("#emp").classList.toggle("hidden",!!items.length);
  if(msg)$("#emp p").textContent=msg;
}
function render(){
  const isList=view==="list";
  $("#hero").classList.toggle("hidden",view!=="home"||genre!=="all");
  $("#chips").classList.toggle("hidden",isList);
  document.querySelectorAll("#main>section.sec:not(#sec-out):not(#sec-rec)").forEach(s=>s.classList.toggle("hidden",isList));
  if(isList){
    $("#sec-rec").classList.add("hidden");
    Promise.all(myList.map(id=>store.get(id)||details(id).catch(()=>null))).then(a=>showOut("My List",a.filter(Boolean),"Abhi list khaali hai — + dabake titles add karo"));
    return;
  }
  $("#sec-out").classList.add("hidden");
  if(view!=="home")document.querySelectorAll("#main>section.sec:not(#sec-out):not(#sec-rec)").forEach(s=>obs.observe(s));
  ROWS.forEach(r=>{if(r.loaded)drawRow(r);else if(view!=="home"||genre!=="all")loadRow(r)});
  drawRecent();
}
function go(v){view=v;document.querySelectorAll(".links a").forEach(a=>a.classList.toggle("on",a.dataset.v===v));$("#si").value="";render();scrollTo({top:0,behavior:"smooth"})}

/* ============ MODAL ============ */
async function openM(id){
  const m=$("#modal");m.classList.add("on");document.body.style.overflow="hidden";
  $("#mbody").innerHTML='<div style="padding:5rem;display:flex;justify-content:center"><div class="spin"></div></div>';
  let t;try{t=store.get(id)||await details(id)}catch(e){onErr(e);return closeM()}
  recent=[id,...recent.filter(x=>x!==id)].slice(0,12);save();drawRecent();
  const inL=myList.includes(id),yt=ytId(t.trailer);
  $("#mbody").innerHTML=`<div class="mv" id="mv" style="background-image:url('${esc(t.backdrop||t.trailer_thumbnail||poster(t))}')"></div>
   <div class="mb"><h2>${esc(t.title)}</h2>
   <div class="mm">${rating(t)?`<span class="rt"><i class="fas fa-star"></i> ${rating(t)}</span>`:""}${t.critic_score?`<span>🍅 ${t.critic_score}%</span>`:""}<span>${t.year||""}${t.end_year&&t.end_year!==t.year?"–"+t.end_year:""}</span><span>${dur(t.runtime_minutes)}</span>${t.us_rating?`<span class="tag">${esc(t.us_rating)}</span>`:""}<span class="tag">${typeLabel(t)}</span>${(t.genre_names||[]).map(g=>`<span class="tag">${esc(g)}</span>`).join("")}</div>
   <p>${esc(t.plot_overview||"Description available nahi hai.")}</p>
   <div class="btns">${yt?`<button class="btn b1" id="trl"><i class="fas fa-play"></i> Trailer</button>`:""}<button class="btn b2" data-add="${id}" id="mad"><i class="fas fa-${inL?"check":"plus"}"></i> ${inL?"In My List":"My List"}</button></div>
   <div class="wt">Where to Watch <select id="mreg">${["IN","US","GB","CA","AU"].map(r=>`<option ${r===region?"selected":""}>${r}</option>`).join("")}</select></div>
   <div id="srcs"><div class="spin" style="width:28px;height:28px;border-width:3px"></div></div></div>`;
  if(yt)$("#trl").onclick=()=>{$("#mv").innerHTML=`<iframe src="https://www.youtube.com/embed/${yt}?autoplay=1&rel=0" allow="autoplay;encrypted-media;fullscreen" allowfullscreen></iframe>`};
  $("#mreg").onchange=e=>{region=e.target.value;localStorage.px_region=region;$("#reg").value=region;loadSrc(id)};
  loadSrc(id);
}
async function loadSrc(id){
  const el=$("#srcs");if(!el)return;
  try{
    const list=await api(`/title/${id}/sources?region=${region}`,SRC_TTL);
    const G={sub:["📺 Stream (Subscription)",[]],free:["🆓 Free",[]],rent:["🎟️ Rent",[]],buy:["🛒 Buy",[]]},seen=new Set();
    (Array.isArray(list)?list:[]).forEach(s=>{const ty=s.type==="tve"?"sub":s.type,k=ty+s.source_id;if(!G[ty]||seen.has(k))return;seen.add(k);G[ty][1].push(s)});
    const h=Object.values(G).filter(g=>g[1].length).map(([n,a])=>`<div style="margin-bottom:1rem"><div style="font-size:.85rem;color:var(--t2);margin-bottom:.5rem">${n}</div><div class="src">${a.map(s=>`<a href="${esc(s.web_url||"#")}" target="_blank" rel="noopener noreferrer">${esc(s.name)}${s.format?` <small>${esc(s.format)}</small>`:""}${s.price?`<small>${region==="IN"?"₹":"$"}${s.price}</small>`:""}</a>`).join("")}</div></div>`).join("");
    el.innerHTML=h||`<p style="color:var(--t2)">Is region (${region}) me abhi koi streaming source nahi mila. Dusra region try karo.</p>`;
  }catch(e){el.innerHTML='<p style="color:var(--t2)">Sources load nahi hue.</p>';onErr(e)}
}
function closeM(){$("#modal").classList.remove("on");document.body.style.overflow="";$("#mbody").innerHTML=""}

/* ============ SEARCH ============ */
let sT;
$("#si").addEventListener("input",e=>{
  clearTimeout(sT);const q=e.target.value.trim();
  if(!q){render();return}
  sT=setTimeout(async()=>{
    try{
      const s=await api("/search?q="+encodeURIComponent(q),864e5);
      const r=(s.title_results||[]).slice(0,18);
      $("#hero").classList.add("hidden");$("#chips").classList.add("hidden");
      document.querySelectorAll("#main>section.sec:not(#sec-out)").forEach(x=>x.classList.add("hidden"));
      showOut(`Results for "${q}"`,r.map(x=>store.get(x.id)||{id:x.id,title:x.name,year:x.year,type:x.type,image_url:x.image_url}),"Dusra keyword try karo");
      r.slice(0,12).forEach(x=>{if(!store.has(x.id))details(x.id).then(d=>{if($("#si").value.trim()===q){const c=document.querySelector(`#out .card[data-id="${x.id}"]`);if(c)c.outerHTML=card(d)}}).catch(()=>{})});
    }catch(e){onErr(e)}
  },450);
});

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
  const add=e.target.closest("[data-add]");
  if(add){e.stopPropagation();const id=+add.dataset.add;
    myList=myList.includes(id)?myList.filter(x=>x!==id):[...myList,id];save();
    document.querySelectorAll(`[data-add="${id}"]`).forEach(b=>{const on=myList.includes(id);b.classList.toggle("on",on);b.innerHTML=`<i class="fas fa-${on?"check":"plus"}"></i>${b.id==="mad"?(on?" In My List":" My List"):""}`});
    toast(myList.includes(id)?"My List me add ho gaya ✔":"My List se hata diya");if(view==="list")render();return}
  const nv=e.target.closest("[data-sc]");
  if(nv){const[i,d]=nv.dataset.sc.split(":");$("#row-"+i).scrollBy({left:d*900,behavior:"smooth"});return}
  const c=e.target.closest(".card");if(c)return openM(+c.dataset.id);
  if(e.target.id==="modal")closeM();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
document.querySelectorAll(".links a").forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.v)});
$("#st").onclick=()=>{$("#sbox").classList.toggle("on");if($("#sbox").classList.contains("on"))$("#si").focus()};
$("#th").onclick=()=>{document.body.classList.toggle("light");$("#th").className="fas ic "+(document.body.classList.contains("light")?"fa-moon":"fa-sun")};
$("#reg").value=region;$("#reg").onchange=e=>{region=e.target.value;localStorage.px_region=region};
$("#chips").innerHTML=GENRES.map(([k,l],i)=>`<div class="chip ${i?"":"on"}" data-g="${k}">${l}</div>`).join("");
$("#chips").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");genre=c.dataset.g;render()};
addEventListener("scroll",()=>$("#nav").classList.toggle("sc",scrollY>50));

/* ============ INIT ============ */
if(WORKER_URL.includes("YOUR-WORKER"))$("#warn").classList.remove("hidden");
buildHome();
addEventListener("load",()=>setTimeout(()=>$("#loader").classList.add("off"),1200));
</script>
</body>
</html>
